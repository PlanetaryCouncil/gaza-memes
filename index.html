<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
    <meta http-equiv="Cache-Control" content="no-store, max-age=0">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <title>Memes</title>
    <meta
      name="description"
      content="Help decide which memes work best. Change in public perception can end the war."
    >
    <meta property="og:type" content="website">
    <meta property="og:title" content="Ministry of Memes and Better Propaganda">
    <meta property="og:site_name" content="Ministry of Memes and Better Propaganda">
    <meta
      property="og:description"
      content="Help decide which memes work best. Change in public perception can end the war."
    >
    <meta
      property="og:image"
      content="https://planetarycouncil.github.io/ministry-of-memes-and-better-propaganda/preview-image.jpg"
    >
    <meta
      property="og:image:secure_url"
      content="https://planetarycouncil.github.io/ministry-of-memes-and-better-propaganda/preview-image.jpg"
    >
    <meta property="og:image:type" content="image/jpeg">
    <meta property="og:image:width" content="1200">
    <meta property="og:image:height" content="630">
    <meta property="og:image:alt" content="Ministry of Memes and Better Propaganda preview image">
    <meta
      property="og:url"
      content="https://planetarycouncil.github.io/ministry-of-memes-and-better-propaganda/"
    >
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="Ministry of Memes and Better Propaganda">
    <meta
      name="twitter:description"
      content="Help decide which memes work best. Change in public perception can end the war."
    >
    <meta
      name="twitter:image"
      content="https://planetarycouncil.github.io/ministry-of-memes-and-better-propaganda/preview-image.jpg"
    >
    <meta name="twitter:image:alt" content="Ministry of Memes and Better Propaganda preview image">
    <link rel="canonical" href="https://planetarycouncil.github.io/ministry-of-memes-and-better-propaganda/">
    <link rel="stylesheet" href="styles.css">
    <script src="https://challenges.cloudflare.com/turnstile/v0/api.js" async defer></script>
  </head>
  <body>
    <div id="completion-confetti" class="completion-confetti" aria-hidden="true"></div>
    <section id="intro-overlay" class="intro-overlay" aria-label="Intro screen">
      <video
        id="intro-video-blur"
        class="intro-video intro-video-blur"
        autoplay
        muted
        loop
        playsinline
        preload="auto"
      >
        <source src="intro-video.mp4" type="video/mp4">
      </video>
      <div class="intro-stage">
        <div class="intro-video-frame">
          <video
            id="intro-video"
            class="intro-video intro-video-main"
            autoplay
            muted
            loop
            playsinline
            preload="auto"
          >
            <source src="intro-video.mp4" type="video/mp4">
          </video>
        </div>
      </div>
      <div class="intro-scrim"></div>
      <div class="intro-copy">
        <button id="intro-proceed" class="intro-button" type="button">
          Start evaluating the memes ➡️
        </button>
        <p class="intro-line">Help decide which memes work best.</p>
        <p class="intro-note">Change in public perception can end the war.</p>
      </div>
    </section>

    <div class="page-shell">
      <main class="layout">
        <section class="panel app-panel">
          <div class="stage-toolbar compact-toolbar">
            <button id="previous-button" class="nav-button" type="button" aria-label="Previous image">
              &#8592;
            </button>
            <div class="mode-toggle" aria-label="Meme tone">
              <span id="mode-label-negative" class="mode-toggle-label">Doom</span>
              <button
                id="mode-toggle"
                class="mode-toggle-button is-positive"
                type="button"
                role="switch"
                aria-checked="true"
                aria-label="Toggle between positive and negative memes"
              >
                <span class="mode-toggle-thumb"></span>
              </button>
              <span id="mode-label-positive" class="mode-toggle-label is-active">Positive</span>
            </div>
            <h1 id="image-title">Loading images...</h1>
            <div class="header-counters" aria-label="Session counters">
              <p><span>Total</span><strong id="total-count">0</strong></p>
              <p><span>Skipped</span><strong id="skipped-count">0</strong></p>
              <p><span>Rated</span><strong id="rated-count">0</strong></p>
            </div>
            <button id="next-button" class="nav-button" type="button" aria-label="Next image">
              &#8594;
            </button>
          </div>

          <div id="image-frame" class="image-frame">
            <div id="image-spinner" class="image-spinner" aria-hidden="true"></div>
            <img id="image-view" alt="Image being rated">
          </div>

          <section id="image-context" class="image-context" aria-live="polite" hidden></section>

          <form id="rating-form" class="rating-form">
            <section class="rating-row">
              <div class="rating-side">
                <p class="score-pill"><strong id="score-value">...</strong><span>/10</span></p>
              </div>

              <fieldset class="star-field">
                <legend class="sr-only">Score from 0 to 10 in half-point steps</legend>
                <div id="star-rating" class="star-rating" role="radiogroup" aria-label="Image score"></div>
              </fieldset>

              <div class="action-side">
                <button id="submit-button" class="primary-button save-button" type="submit">
                  save ➡️
                </button>
              </div>
            </section>

            <div id="captcha-slot" class="captcha-slot"></div>
            <div id="connection-status" class="status-card status-muted"></div>
            <div id="form-status" class="status-card status-muted"></div>
            <div id="completion-status" class="status-card status-muted"></div>

            <label class="field-group" for="negative">
              <span>✅ Positive</span>
              <textarea
                id="positive"
                name="positive"
                rows="3"
                maxlength="280"
                placeholder="What works well?"
              ></textarea>
            </label>

            <label class="field-group" for="neutral">
              <span>🔄 Neutral</span>
              <textarea
                id="neutral"
                name="neutral"
                rows="3"
                maxlength="280"
                placeholder="Balanced or informational notes"
              ></textarea>
            </label>

            <label class="field-group" for="negative">
              <span>⛔️ Negative</span>
              <textarea
                id="negative"
                name="negative"
                rows="3"
                maxlength="280"
                placeholder="What hurts the image?"
              ></textarea>
            </label>
          </form>

        </section>

        <section class="panel footer-panel">
          <div class="footer-grid">
            <div class="footer-column">
              <nav class="footer-links" aria-label="Social links">
                <a class="footer-social-link" href="https://x.com/PlanetCouncil/" target="_blank" rel="noreferrer">
                  <span class="footer-icon" aria-hidden="true">
                    <svg viewBox="0 0 24 24" role="img" focusable="false">
                      <path fill="currentColor" d="M18.9 2H22l-6.77 7.74L23.2 22h-6.26l-4.9-7.42L5.5 22H2.4l7.24-8.28L1.2 2H7.6l4.43 6.72L18.9 2Zm-1.1 18h1.73L6.66 3.9H4.8L17.8 20Z"/>
                    </svg>
                  </span>
                  Twitter
                </a>
                <a class="footer-social-link" href="https://t.me/PlanetaryCouncil" target="_blank" rel="noreferrer">
                  <span class="footer-icon" aria-hidden="true">
                    <svg viewBox="0 0 24 24" role="img" focusable="false">
                      <path fill="currentColor" d="M21.94 4.66a1.5 1.5 0 0 0-1.72-.24L3.1 11.2a1.5 1.5 0 0 0 .11 2.82l4.18 1.39 1.55 4.98a1.5 1.5 0 0 0 2.54.62l2.35-2.42 4.61 3.38a1.5 1.5 0 0 0 2.37-.88l2.95-14.6a1.5 1.5 0 0 0-.82-1.83ZM9.8 14.61l8.54-7.59-6.79 8.64-.33 3.16-1.42-4.21Z"/>
                    </svg>
                  </span>
                  Telegram
                </a>
                <a class="footer-social-link" href="https://github.com/PlanetaryCouncil/ministry-of-memes-and-better-propaganda" target="_blank" rel="noreferrer">
                  <span class="footer-icon" aria-hidden="true">
                    <svg viewBox="0 0 24 24" role="img" focusable="false">
                      <path fill="currentColor" d="M12 .5C5.65.5.5 5.66.5 12.02c0 5.1 3.3 9.42 7.87 10.95.58.11.79-.25.79-.56 0-.28-.01-1.02-.02-2-3.2.7-3.88-1.54-3.88-1.54-.52-1.33-1.28-1.68-1.28-1.68-1.04-.71.08-.7.08-.7 1.15.08 1.75 1.18 1.75 1.18 1.02 1.76 2.69 1.25 3.35.95.1-.74.4-1.25.72-1.54-2.55-.29-5.24-1.28-5.24-5.71 0-1.26.45-2.3 1.18-3.11-.12-.29-.51-1.47.11-3.06 0 0 .97-.31 3.17 1.19a10.98 10.98 0 0 1 5.77 0c2.2-1.5 3.16-1.19 3.16-1.19.63 1.59.24 2.77.12 3.06.74.81 1.18 1.85 1.18 3.11 0 4.44-2.7 5.41-5.27 5.69.41.36.78 1.08.78 2.18 0 1.58-.02 2.86-.02 3.25 0 .31.21.68.8.56A11.53 11.53 0 0 0 23.5 12C23.5 5.66 18.35.5 12 .5Z"/>
                    </svg>
                  </span>
                  Github
                </a>
              </nav>
            </div>

            <div class="footer-column">
              <nav class="footer-links" aria-label="Project links">
                <button class="footer-link-button" type="button" data-fragment="about-us.html">About us</button>
                <button id="open-intro-button" class="footer-link-button" type="button">Opening Intro Movie</button>
                <button class="footer-link-button" type="button" data-fragment="personal-favourites.html">Personal favourites</button>
                <button class="footer-link-button" type="button" data-fragment="licence.html">Licence</button>
                <button class="footer-link-button" type="button" data-fragment="careers.html">Careers</button>
                <button class="footer-link-button" type="button" data-fragment="donate.html">Donate</button>
              </nav>
            </div>

            <div class="footer-column footer-cta-column">
              <a
                class="footer-cta"
                href="https://github.com/PlanetaryCouncil/ministry-of-memes-and-better-propaganda/issues/3"
                target="_blank"
                rel="noreferrer"
              >
                Submit your memes
                <span class="footer-cta-icon" aria-hidden="true">
                  <svg viewBox="0 0 24 24" role="img" focusable="false">
                    <path fill="currentColor" d="M14 3h7v7h-2V6.41l-9.29 9.3-1.42-1.42 9.3-9.29H14V3ZM5 5h6v2H7v10h10v-4h2v6H5V5Z"/>
                  </svg>
                </span>
              </a>
            </div>
          </div>
        </section>

        <div id="modal-overlay" class="modal-overlay" hidden>
          <section
            id="fragment-modal"
            class="modal-card"
            role="dialog"
            aria-modal="true"
            aria-labelledby="modal-title"
          >
            <div class="modal-header">
              <h2 id="modal-title">Loading…</h2>
              <button id="modal-close" class="modal-close" type="button" aria-label="Close dialog">×</button>
            </div>
            <div id="modal-content" class="modal-content"></div>
          </section>
        </div>
      </main>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="supabase-config.js"></script>
    <script type="module" src="app.js"></script>
  </body>
</html>
