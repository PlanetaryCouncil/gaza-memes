<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Image Rater</title>
    <meta
      name="description"
      content="Randomized image rating tool with Supabase-backed feedback collection."
    >
    <link rel="stylesheet" href="styles.css">
    <script src="https://challenges.cloudflare.com/turnstile/v0/api.js" async defer></script>
  </head>
  <body>
    <div class="page-shell">
      <main class="layout">
        <section class="panel app-panel">
          <div class="stage-toolbar compact-toolbar">
            <button id="previous-button" class="nav-button" type="button" aria-label="Previous image">
              &#8592;
            </button>
            <h1 id="image-title">Loading images...</h1>
            <button id="next-button" class="nav-button" type="button" aria-label="Next image">
              &#8594;
            </button>
          </div>

          <div class="image-frame">
            <img id="image-view" alt="Image being rated">
          </div>

          <div class="image-meta">
            <span id="image-folder" class="meta-pill">Folder</span>
            <a id="image-link" class="meta-link" href="#" target="_blank" rel="noreferrer">
              Open original
            </a>
          </div>

          <form id="rating-form" class="rating-form">
            <section class="section-heading rating-heading">
              <div>
                <p class="toolbar-label">Rating</p>
                <h2>Score this image</h2>
              </div>
              <p class="score-pill"><strong id="score-value">5.0</strong><span>/10</span></p>
            </section>

            <fieldset class="star-field">
              <legend class="sr-only">Score from 0 to 10 in half-point steps</legend>
              <div id="star-rating" class="star-rating" role="radiogroup" aria-label="Image score"></div>
            </fieldset>

            <label class="field-group" for="negative">
              <span>Negative</span>
              <textarea
                id="negative"
                name="negative"
                rows="3"
                maxlength="280"
                placeholder="What hurts the image?"
              ></textarea>
            </label>

            <label class="field-group" for="neutral">
              <span>Neutral</span>
              <textarea
                id="neutral"
                name="neutral"
                rows="3"
                maxlength="280"
                placeholder="Balanced or informational notes"
              ></textarea>
            </label>

            <label class="field-group" for="positive">
              <span>Positive</span>
              <textarea
                id="positive"
                name="positive"
                rows="3"
                maxlength="280"
                placeholder="What works well?"
              ></textarea>
            </label>

            <button id="submit-button" class="primary-button" type="submit">
              Save rating
            </button>
          </form>

          <div id="captcha-slot" class="captcha-slot"></div>
          <div id="connection-status" class="status-card status-muted"></div>
          <div id="form-status" class="status-card status-muted">
            Waiting for configuration.
          </div>
        </section>
      </main>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="supabase-config.js"></script>
    <script type="module" src="app.js"></script>
  </body>
</html>
