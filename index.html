    <link rel="stylesheet" href="styles.css">
    <script src="https://challenges.cloudflare.com/turnstile/v0/api.js" async defer></script>
  </head>
  <body>
    <div class="page-shell">
      <main class="layout">
        <section class="panel app-panel">
          <div class="stage-toolbar compact-toolbar">
            <button id="previous-button" class="nav-button" type="button" aria-label="Previous image">
              &#8592;
            </button>
            <h1 id="image-title">Loading images...</h1>
            <div class="header-counters" aria-label="Session counters">
              <p><span>Total</span><strong id="total-count">0</strong></p>
              <p><span>Skipped</span><strong id="skipped-count">0</strong></p>
              <p><span>Rated</span><strong id="rated-count">0</strong></p>
            </div>
            <button id="next-button" class="nav-button" type="button" aria-label="Next image">
              &#8594;
            </button>
          </div>

          <div class="image-frame">
            <img id="image-view" alt="Image being rated">
          </div>

          <section id="image-context" class="image-context" aria-live="polite" hidden></section>

          <form id="rating-form" class="rating-form">
            <section class="rating-row">
              <div class="rating-side">
                <p class="score-pill"><strong id="score-value">...</strong><span>/10</span></p>
              </div>

              <fieldset class="star-field">
                <legend class="sr-only">Score from 0 to 10 in half-point steps</legend>
                <div id="star-rating" class="star-rating" role="radiogroup" aria-label="Image score"></div>
              </fieldset>

              <div class="action-side">
                <button id="submit-button" class="primary-button save-button" type="submit">
                  save ➡️
                </button>
              </div>
            </section>

            <div id="captcha-slot" class="captcha-slot"></div>
            <div id="connection-status" class="status-card status-muted"></div>
            <div id="form-status" class="status-card status-muted"></div>

            <label class="field-group" for="negative">
              <span>✅ Positive</span>
              <textarea
                id="positive"
                name="positive"
                rows="3"
                maxlength="280"
                placeholder="What works well?"
              ></textarea>
            </label>

            <label class="field-group" for="neutral">
              <span>🔄 Neutral</span>
              <textarea
                id="neutral"
                name="neutral"
                rows="3"
                maxlength="280"
                placeholder="Balanced or informational notes"
              ></textarea>
            </label>

            <label class="field-group" for="negative">
              <span>⛔️ Negative</span>
              <textarea
                id="negative"
                name="negative"
                rows="3"
                maxlength="280"
                placeholder="What hurts the image?"
              ></textarea>
            </label>
          </form>

        </section>

        <section class="panel footer-panel">
          <div class="footer-grid">
            <div class="footer-column">
              <h2>Socials</h2>
